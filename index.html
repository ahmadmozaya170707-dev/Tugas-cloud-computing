<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo AWS Amplify</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #232f3e 0%, #3b4d66 50%, #ff9900 130%);
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 520px;
      width: 100%;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .avatar {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff9900, #ffb84d);
      color: #232f3e;
      font-size: 36px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 { color: #232f3e; font-size: 26px; margin-bottom: 10px; }
    .subtitle { color: #5f6b7a; margin-bottom: 24px; line-height: 1.5; }
    .info {
      background: #f4f6f9;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      color: #232f3e;
      line-height: 1.8;
    }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
    .badge {
      background: #232f3e;
      color: #fff;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
    }
    .badge.orange { background: #ff9900; color: #232f3e; font-weight: bold; }
    .version {
      display: inline-block;
      border: 2px dashed #ff9900;
      color: #b36b00;
      padding: 6px 16px;
      border-radius: 8px;
      font-weight: bold;
    }
    footer { margin-top: 20px; font-size: 12px; color: #8a94a3; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">N</div>
    <h1>Halo! Website ini di-hosting di AWS Amplify</h1>
    <p class="subtitle">Demo deploy otomatis dari GitHub dengan CI/CD</p>

    <div class="info">
      <strong>Nama:</strong> Ahmad Mozaya Putra<br>
      <strong>NIM:</strong>I.2510565<br>
      <strong>Mata Kuliah:</strong> Cloud Computing
    </div>

    <footer>Dibuat untuk tugas Video Tutorial Cloud Computing</footer>
  </div>
</body>
</html>
